# GENERATED by generate.py / session_gen.py of px4_sim_ugv_uav_greenhouse_dynamic -- edit those, not this file.
# The warehouse sessions' UGV + UAV pair (depth cameras, rbl configs, ArUco deck board landing) in the dynamic
# greenhouse (wind-blown crops, walking operators), counting the fruits of the rows it covers (`scan` window).
#
# 1 UGV + UAV pairs doing warehouse shelf inspection at the same time, each one a copy of
# ../px4_sim_2ugv_2uav_warehouse_stereo_larger's pairs (rbl_controller on both vehicles, UAV carried on
# the UGV deck, PX4 precision landing on its ArUco board), with its own mission node. Lighter for gz:
# headless, no shadows, static visuals merged into a few meshes, gz without PX4's camera streaming,
# 160x120 depth cameras, down cameras rendered only while their pair lands. README.md has the details.
#
#   ./start.sh      then, once every px4_bridge pane printed 'Arming' / 'px4_bridge started':
#   ./deploy.sh pair <k> row <r> column <c> <left|right>    (all 1 prepared in the `mission` window history)
#   ./deploy.sh abort                                       every pair holds
#   ./kill.sh
root: ./
name: ugv_uav_greenhouse_dynamic
socket_name: ghdynugvuav
attach: false
tmux_options: -f ./tmux.conf
startup_window: deploy
pre_window:
  - . ./env.sh
  - if [ "$PIN_CPUS" = 1 ]; then taskset -cp $OTHER_CPUS $$ >/dev/null; fi
  # PX4 spawns only from its own Tools/simulation/gz/{worlds,models}: link this folder's in
  - for w in ./worlds/*.sdf; do ln -sfn "$(readlink -f $w)" "$PX4_DIR/Tools/simulation/gz/worlds/$(basename $w)" 2>/dev/null; done
  - for m in ./models/*/; do ln -sfn "$(readlink -f $m)" "$PX4_DIR/Tools/simulation/gz/models/$(basename $m)" 2>/dev/null; done
  # the crops' meshes and the operators' skin (model://greenhouse_crops_dynamic, model://greenhouse_operator)
  - for m in ./worlds/models/*/; do ln -sfn "$(readlink -f $m)" "$PX4_DIR/Tools/simulation/gz/models/$(basename $m)" 2>/dev/null; done
  - if [ -n "$ZSH_VERSION" ]; then RSH=zsh; else RSH=bash; fi
  - source /opt/ros/jazzy/setup.$RSH
  - source ${IRBL_INSTALL:-../../../../install}/setup.$RSH
  - export ATUIN_FILTER_MODE=session
windows:
  - mission:
      layout: tiled
      panes:
        - until ros2 service list 2>/dev/null | grep -q "/ugv1/rbl_controller/goto" &&
          ros2 service list 2>/dev/null | grep -q "/uav1/warehouse_inspection/inspect"; do sleep 1; done;
          ros2 run rbl_mission ugv_uav_mission_node --ros-args -r __node:=ugv_uav_mission_1
          --params-file ./config/greenhouse_map.yaml -p use_sim_time:=true
          -p map.world_sdf:=$(readlink -f ./worlds/$PX4_GZ_WORLD.sdf)
          -p ugv:=ugv1 -p uav:=uav1 -p detach_topic:=/ugv1/uav_detach
          -p attach_topic:=/ugv1/uav_attach -p planner.mode:=$PLANNER
        - "clear; echo \"Wait for 'Arming' in the px4_bridge window (all 1 UGVs) and ~30 s more, then arrow-up: all 1 pairs at once, or one ./deploy.sh pair <k> <row> <column> <left|right> line each (./deploy.sh map, ./deploy.sh -h, ./deploy.sh abort)\"; . ./history_prefill.sh './deploy.sh abort' './deploy.sh pair 1 6 2 left' './deploy.sh pair 1 5 2 left' './deploy.sh pair 1 4 2 left' './deploy.sh pair 1 4 2 left'"
  - deploy:
      layout: tiled
      panes:
        - "clear; echo \"pair 1: wait for 'Arming' in the px4_bridge window and ~30 s more, then arrow-up + Enter (C-a s: synchronize-panes, every pair at once)\"; . ./history_prefill.sh './deploy.sh pair 1 abort' './deploy.sh pair 1 6 2 left' './deploy.sh pair 1 5 2 left' './deploy.sh pair 1 4 2 left'"
  - states:
      layout: tiled
      panes:
        - "(ros2 topic echo /ugv_uav_mission_1/state std_msgs/msg/String --qos-durability transient_local --field data & ros2 topic echo /uav1/warehouse_inspection/state std_msgs/msg/String --qos-durability transient_local --field data | sed -u \"s/^/  uav1: /\"; wait)"
  - micro_xrce_agent:
      layout: tiled
      panes:
        # one agent serves every PX4 instance (each in its own namespace)
        - MicroXRCEAgent udp4 -p 8888
  - gz:
      layout: tiled
      panes:
        - . $PX4_DIR/build/px4_sitl_default/rootfs/gz_env.sh && export GZ_SIM_SERVER_CONFIG_PATH=$(readlink -f ./config/gz_server.config) &&
          W=$PX4_DIR/Tools/simulation/gz/worlds/$PX4_GZ_WORLD.sdf &&
          if [ "$PIN_CPUS" = 1 ]; then taskset -c $GZ_CPUS gz sim --verbose=1 -r -s $W; else gz sim --verbose=1 -r -s $W; fi
        - if [ -z "$HEADLESS" ]; then until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/clock"; do sleep 1; done;
          . $PX4_DIR/build/px4_sitl_default/rootfs/gz_env.sh && gz sim -g; else echo "headless (HEADLESS=0 ./start.sh for the gz GUI)"; fi
  - px4_sitl:
      layout: tiled
      panes:
        # pane order = PX4 instance (ugv<k> = 2(k-1), uav<k> = 2(k-1)+1; set_px4_params.sh relies on it)
        - cp ../px4_sim_ugv_uav_warehouse_stereo/airframes/* $PX4_DIR/build/px4_sitl_default/etc/init.d-posix/airframes/ &&
          until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/clock"; do sleep 1; done;
          cd $PX4_DIR/build/px4_sitl_default/rootfs &&
          PX4_GZ_STANDALONE=1 PX4_SYS_AUTOSTART=4044 PX4_SIM_MODEL=gz_ugv1_carrier_gh
          PX4_GZ_MODEL_POSE="$UGV1_X,$UGV1_Y,$UGV_SPAWN_Z,0,0,0" PX4_UXRCE_DDS_NS=ugv_1
          ../bin/px4 -i 0
        - cd $PX4_DIR && until [ -f ./build/px4_sitl_default/etc/init.d-posix/airframes/4043_gz_x500_stereo_cam_down_carried ]; do sleep 1; done;
          until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/model/ugv1_carrier_gh_0/"; do sleep 1; done;
          PX4_GZ_STANDALONE=1 GZ_IP=127.0.0.1 PX4_SYS_AUTOSTART=4043 PX4_SIM_MODEL=gz_uav1_x500_crop
          PX4_GZ_MODEL_POSE="$UGV1_X,$UGV1_Y,$UAV_SPAWN_Z,0,0,0" PX4_UXRCE_DDS_NS=uav_1
          ./build/px4_sitl_default/bin/px4 -i 1
  - px4_params:
      layout: tiled
      panes:
        - ./set_px4_params.sh px4_sitl.0 config/ugv_px4.yaml
        - ./set_px4_params.sh px4_sitl.1 config/uav_px4.yaml
  - gz_bridges:
      layout: tiled
      panes:
        - until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/clock"; do sleep 1; done;
          ros2 run ros_gz_bridge parameter_bridge
          "/world/$PX4_GZ_WORLD/clock@rosgraph_msgs/msg/Clock[gz.msgs.Clock"
          --ros-args -r "/world/$PX4_GZ_WORLD/clock:=/clock"
        # depth clouds -> /<vehicle>/sensors/stereo/points (frame <vehicle>/stereo_link, x forward), one
        # bridge per vehicle; no depth image (nothing uses it here)
        - for V in ugv1:ugv1_carrier_gh_0 uav1:uav1_x500_crop_1; do
          N=${V%%:*}; M=${V#*:};
          S="/world/$PX4_GZ_WORLD/model/$M/link/stereo_link/sensor/stereo_depth/depth_image";
          ( until gz topic -l 2>/dev/null | grep -q "$S/points"; do sleep 1; done;
          ros2 run ros_gz_bridge parameter_bridge "$S/points@sensor_msgs/msg/PointCloud2[gz.msgs.PointCloudPacked"
          --ros-args -r "$S/points:=/$N/sensors/stereo/points"
          -p use_sim_time:=true -r __node:=${N}_stereo_bridge ) & done; wait
        # UAV down cameras -> /<uav>/sensors/down_cam/{image,camera_info}, LAZY: subscribed in gz only
        # while a ROS node subscribes (aruco_landing_target.py, only while its pair lands) -> gz-sensors
        # skips rendering the camera the rest of the time
        - for V in uav1:uav1_x500_crop_1; do
          N=${V%%:*}; M=${V#*:};
          S="/world/$PX4_GZ_WORLD/model/$M/link/down_cam_link/sensor/down_cam";
          ( until gz topic -l 2>/dev/null | grep -q "$S/image"; do sleep 1; done;
          ros2 run ros_gz_bridge parameter_bridge "$S/image@sensor_msgs/msg/Image[gz.msgs.Image"
          "$S/camera_info@sensor_msgs/msg/CameraInfo[gz.msgs.CameraInfo"
          --ros-args -r "$S/image:=/$N/sensors/down_cam/image" -p lazy:=true
          -r "$S/camera_info:=/$N/sensors/down_cam/camera_info" -p use_sim_time:=true -r __node:=${N}_down_cam_bridge ) & done; wait
        # ROS -> gz: release / re-attach each UAV on its UGV's deck
        - ros2 run ros_gz_bridge parameter_bridge
          "/ugv1/uav_detach@std_msgs/msg/Empty]gz.msgs.Empty" "/ugv1/uav_attach@std_msgs/msg/Empty]gz.msgs.Empty"
          --ros-args -r __node:=uav_dock_bridge
  - sensor_tf:
      layout: tiled
      panes:
        # static "<vehicle>/fcu" -> sensor frames of every vehicle (config/<ugv|uav>_sensors.yaml)
        - for V in ugv1:ugv uav1:uav; do ./publish_sensor_tf.sh ${V%%:*} config/${V#*:}_sensors.yaml & done; wait
  - px4_bridge:
      layout: tiled
      panes:
        # UGVs arm right away and hold their spawn point; UAVs stay disarmed on the deck until their mission calls ~/arm
        - ros2 run rbl_px4_bridge px4_bridge_node --ros-args -r __ns:=/ugv1
          -p uav_name:=ugv1 -p control_frame:=$CONTROL_FRAME
          -p home_offset_x:=$UGV1_X -p home_offset_y:=$UGV1_Y -p home_offset_z:=$UGV_HOME_Z
          -p takeoff_altitude:=0.0 -p auto_arm:=true -p max_setpoint_speed:=1.0 -p ground_vehicle:=true
          -p use_sim_time:=true -p publish_rate:=20.0 -p target_system:=1 -p px4_ns:=ugv_1
        - ros2 run rbl_px4_bridge px4_bridge_node --ros-args -r __ns:=/uav1
          -p uav_name:=uav1 -p control_frame:=$CONTROL_FRAME
          -p home_offset_x:=$UGV1_X -p home_offset_y:=$UGV1_Y -p home_offset_z:=$UAV_HOME_Z
          -p takeoff_altitude:=1.5 -p auto_arm:=false -p takeoff_at_current_position:=true
          -p use_sim_time:=true -p publish_rate:=50.0 -p target_system:=2 -p px4_ns:=uav_1
  - rbl_controller:
      layout: tiled
      panes:
        # each UGV: the shared config with its own UAV in filter_agents (copy in /tmp)
        - C=/tmp/ugv_uav_greenhouse_dynamic_ugv1_rbl.yaml; sed "s#/uav1/odometry#/uav1/odometry#" ./config/ugv_rbl.yaml > $C &&
          grep -q "/uav1/odometry" $C && ros2 launch rbl_controller_node rbl_controller.launch.py uav_name:=ugv1
          custom_config:=$C pcl_topic:=/ugv1/sensors/stereo/points control_frame:=$CONTROL_FRAME
        - ros2 launch rbl_controller_node rbl_controller.launch.py uav_name:=uav1
          custom_config:=./config/uav_rbl.yaml pcl_topic:=/uav1/sensors/stereo/points control_frame:=$CONTROL_FRAME
  - aruco:
      layout: tiled
      panes:
        # each UAV's down camera -> its own UGV's board (uav<k>: ids 5(k-1)..5(k-1)+4) -> MAVLink
        # TARGET_RELATIVE to its PX4. Camera subscribed only in PICKUP / RENDEZVOUS / LAND (state_topic)
        - ros2 run rbl_mission aruco_landing_target.py --ros-args -r __ns:=/uav1
          -r image:=/uav1/sensors/down_cam/image -r camera_info:=/uav1/sensors/down_cam/camera_info
          -p use_sim_time:=true -p body_frame:=uav1/fcu -p mavlink_port:=14581
          -p mavlink_sysid:=2 -p "board_ids:=[0, 1, 2, 3, 4]"
          -p "board_sizes:=[0.05, 0.11, 0.11, 0.11, 0.11]"
          -p "board_centers:=[0.0, 0.0, -0.095, 0.095, 0.095, 0.095, 0.095, -0.095, -0.095, -0.095]"
          -p odometry_topic:=/uav_1/fmu/out/vehicle_odometry
          -p state_topic:=/ugv_uav_mission_1/state
  - inspection:
      layout: tiled
      panes:
        - until ros2 service list 2>/dev/null | grep -q "/uav1/rbl_controller/goto"; do sleep 1; done;
          ros2 run rbl_mission warehouse_inspection_node --ros-args -r __ns:=/uav1
          --params-file ./config/greenhouse_map.yaml -p use_sim_time:=true -p planner.mode:=$PLANNER
          -p map.world_sdf:=$(readlink -f ./worlds/$PX4_GZ_WORLD.sdf)
  - scan:
      layout: tiled
      panes:
        # the UAV's crop cameras -> fruit counts of the row segment it covers -> scans/<start time>/ + report
        - ros2 run rbl_mission crop_scanner.py --ros-args -r __ns:=/uav1 -r __node:=crop_scanner
          -p use_sim_time:=true -p uav:=uav1 -p truth:=$(readlink -f ./worlds/crop_truth.json)
          -p data_dir:=$SCAN_DATA_DIR/$SCAN_RUN_ID -p state_topic:=/uav1/warehouse_inspection/state
          -p left_gz_topic:=/world/$PX4_GZ_WORLD/model/uav1_x500_crop_1/link/left_cam_link/sensor/left_cam -p left_gz_depth_topic:=/world/$PX4_GZ_WORLD/model/uav1_x500_crop_1/link/left_cam_link/sensor/left_depth
          -p right_gz_topic:=/world/$PX4_GZ_WORLD/model/uav1_x500_crop_1/link/right_cam_link/sensor/right_cam -p right_gz_depth_topic:=/world/$PX4_GZ_WORLD/model/uav1_x500_crop_1/link/right_cam_link/sensor/right_depth
  - viz:
      layout: tiled
      panes:
        # one mission_viz per pair; pair 1's also draws the warehouse / grid
        - ros2 run rbl_mission mission_viz_node --ros-args --params-file ./config/greenhouse_map.yaml
          -p use_sim_time:=true -p frame:=$CONTROL_FRAME -r __node:=mission_viz
          -r /ugv_uav_mission/state:=/ugv_uav_mission_1/state
          -p ugv:=ugv1 -p uav:=uav1 -p world_sdf:=$(readlink -f ./worlds/$PX4_GZ_WORLD.sdf)
  - rviz:
      layout: tiled
      panes:
        - if [ -n "$WEB_VIZ" ]; then echo "WEB_VIZ set, no rviz2 -- foxglove_bridge on ws://localhost:8765";
          ros2 run foxglove_bridge foxglove_bridge --ros-args -p port:=8765 -p use_sim_time:=true;
          else rviz2 -d ./ugv_uav_pairs.rviz --ros-args -p use_sim_time:=true; fi
