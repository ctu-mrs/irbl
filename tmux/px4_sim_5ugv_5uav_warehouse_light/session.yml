  - aruco:
      layout: tiled
      panes:
        # each UAV's down camera -> its own UGV's board (uav<k>: ids 5(k-1)..5(k-1)+4) -> MAVLink
        # TARGET_RELATIVE to its PX4. Camera subscribed only in PICKUP / RENDEZVOUS / LAND (state_topic)
        - ros2 run rbl_mission aruco_landing_target.py --ros-args -r __ns:=/uav1
          -r image:=/uav1/sensors/down_cam/image -r camera_info:=/uav1/sensors/down_cam/camera_info
          -p use_sim_time:=true -p body_frame:=uav1/fcu -p mavlink_port:=14581
          -p mavlink_sysid:=2 -p "board_ids:=[0, 1, 2, 3, 4]"
          -p "board_sizes:=[0.05, 0.11, 0.11, 0.11, 0.11]"
          -p "board_centers:=[0.0, 0.0, -0.095, 0.095, 0.095, 0.095, 0.095, -0.095, -0.095, -0.095]"
          -p odometry_topic:=/uav_1/fmu/out/vehicle_odometry
          -p state_topic:=/ugv_uav_mission_1/state
        - ros2 run rbl_mission aruco_landing_target.py --ros-args -r __ns:=/uav2
          -r image:=/uav2/sensors/down_cam/image -r camera_info:=/uav2/sensors/down_cam/camera_info
          -p use_sim_time:=true -p body_frame:=uav2/fcu -p mavlink_port:=14583
          -p mavlink_sysid:=4 -p "board_ids:=[5, 6, 7, 8, 9]"
          -p "board_sizes:=[0.05, 0.11, 0.11, 0.11, 0.11]"
          -p "board_centers:=[0.0, 0.0, -0.095, 0.095, 0.095, 0.095, 0.095, -0.095, -0.095, -0.095]"
