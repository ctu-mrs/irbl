  - rbl_controller:
      layout: tiled
      panes:
        # each UGV: the shared config with its own UAV in filter_agents (copy in /tmp)
        - C=/tmp/ugv_uav_warehouse_5pairs_ugv1_rbl.yaml; sed "s#/uav1/odometry#/uav1/odometry#" ./config/ugv_rbl.yaml > $C &&
          grep -q "/uav1/odometry" $C && ros2 launch rbl_controller_node rbl_controller.launch.py uav_name:=ugv1
          custom_config:=$C pcl_topic:=/ugv1/sensors/stereo/points control_frame:=$CONTROL_FRAME
        - ros2 launch rbl_controller_node rbl_controller.launch.py uav_name:=uav1
          custom_config:=./config/uav_rbl.yaml pcl_topic:=/uav1/sensors/stereo/points control_frame:=$CONTROL_FRAME
        - C=/tmp/ugv_uav_warehouse_5pairs_ugv2_rbl.yaml; sed "s#/uav1/odometry#/uav2/odometry#" ./config/ugv_rbl.yaml > $C &&
          grep -q "/uav2/odometry" $C && ros2 launch rbl_controller_node rbl_controller.launch.py uav_name:=ugv2
          custom_config:=$C pcl_topic:=/ugv2/sensors/stereo/points control_frame:=$CONTROL_FRAME
