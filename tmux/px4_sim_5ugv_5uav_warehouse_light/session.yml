          custom_config:=./config/uav_rbl.yaml pcl_topic:=/uav2/sensors/stereo/points control_frame:=$CONTROL_FRAME
        - C=/tmp/ugv_uav_warehouse_5pairs_ugv3_rbl.yaml; sed "s#/uav1/odometry#/uav3/odometry#" ./config/ugv_rbl.yaml > $C &&
          grep -q "/uav3/odometry" $C && ros2 launch rbl_controller_node rbl_controller.launch.py uav_name:=ugv3
