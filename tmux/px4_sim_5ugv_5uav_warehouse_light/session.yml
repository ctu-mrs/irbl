# GENERATED by generate.py (5 pairs) -- edit generate.py, not this file.
#
# 5 UGV + UAV pairs doing warehouse shelf inspection at the same time, each one a copy of
# ../px4_sim_2ugv_2uav_warehouse_stereo_larger's pairs (rbl_controller on both vehicles, UAV carried on
# the UGV deck, PX4 precision landing on its ArUco board), with its own mission node. Lighter for gz:
# headless, no shadows, static visuals merged into a few meshes, gz without PX4's camera streaming,
# 96x72 depth cameras, down cameras rendered only while their pair lands. README.md has the details.
#
#   ./start.sh      then, once every px4_bridge pane printed 'Arming' / 'px4_bridge started':
#   ./deploy.sh pair <k> row <r> column <c> <left|right>    (all 5 prepared in the `mission` window history)
#   ./deploy.sh abort                                       every pair holds
#   ./kill.sh
root: ./
name: ugv_uav_warehouse_5pairs
socket_name: whugvuav5p
attach: false
tmux_options: -f ./tmux.conf
startup_window: mission
pre_window:
  - . ./env.sh
  - if [ "$PIN_CPUS" = 1 ]; then taskset -cp $OTHER_CPUS $$ >/dev/null; fi
  # PX4 spawns only from its own Tools/simulation/gz/{worlds,models}: link this folder's in
  - for w in ./worlds/*.sdf; do ln -sfn "$(readlink -f $w)" "$PX4_DIR/Tools/simulation/gz/worlds/$(basename $w)" 2>/dev/null; done
  - for m in ./models/*/; do ln -sfn "$(readlink -f $m)" "$PX4_DIR/Tools/simulation/gz/models/$(basename $m)" 2>/dev/null; done
  - if [ -n "$ZSH_VERSION" ]; then RSH=zsh; else RSH=bash; fi
  - source /opt/ros/jazzy/setup.$RSH
  - source ${IRBL_INSTALL:-../../../../install}/setup.$RSH
  - export ATUIN_FILTER_MODE=session
windows:
  - mission:
      layout: tiled
      panes:
        - until ros2 service list 2>/dev/null | grep -q "/ugv1/rbl_controller/goto" &&
          ros2 service list 2>/dev/null | grep -q "/uav1/warehouse_inspection/inspect"; do sleep 1; done;
          ros2 run rbl_mission ugv_uav_mission_node --ros-args -r __node:=ugv_uav_mission_1
          --params-file ./config/warehouse_map.yaml -p use_sim_time:=true
          -p map.world_sdf:=$(readlink -f ./worlds/$PX4_GZ_WORLD.sdf)
          -p ugv:=ugv1 -p uav:=uav1 -p detach_topic:=/ugv1/uav_detach
          -p attach_topic:=/ugv1/uav_attach -p planner.mode:=$PLANNER
        - until ros2 service list 2>/dev/null | grep -q "/ugv2/rbl_controller/goto" &&
          ros2 service list 2>/dev/null | grep -q "/uav2/warehouse_inspection/inspect"; do sleep 1; done;
          ros2 run rbl_mission ugv_uav_mission_node --ros-args -r __node:=ugv_uav_mission_2
          --params-file ./config/warehouse_map.yaml -p use_sim_time:=true
          -p map.world_sdf:=$(readlink -f ./worlds/$PX4_GZ_WORLD.sdf)
          -p ugv:=ugv2 -p uav:=uav2 -p detach_topic:=/ugv2/uav_detach
          -p attach_topic:=/ugv2/uav_attach -p planner.mode:=$PLANNER
        - until ros2 service list 2>/dev/null | grep -q "/ugv3/rbl_controller/goto" &&
          ros2 service list 2>/dev/null | grep -q "/uav3/warehouse_inspection/inspect"; do sleep 1; done;
          ros2 run rbl_mission ugv_uav_mission_node --ros-args -r __node:=ugv_uav_mission_3
          --params-file ./config/warehouse_map.yaml -p use_sim_time:=true
          -p map.world_sdf:=$(readlink -f ./worlds/$PX4_GZ_WORLD.sdf)
          -p ugv:=ugv3 -p uav:=uav3 -p detach_topic:=/ugv3/uav_detach
          -p attach_topic:=/ugv3/uav_attach -p planner.mode:=$PLANNER
        - until ros2 service list 2>/dev/null | grep -q "/ugv4/rbl_controller/goto" &&
          ros2 service list 2>/dev/null | grep -q "/uav4/warehouse_inspection/inspect"; do sleep 1; done;
          ros2 run rbl_mission ugv_uav_mission_node --ros-args -r __node:=ugv_uav_mission_4
          --params-file ./config/warehouse_map.yaml -p use_sim_time:=true
          -p map.world_sdf:=$(readlink -f ./worlds/$PX4_GZ_WORLD.sdf)
          -p ugv:=ugv4 -p uav:=uav4 -p detach_topic:=/ugv4/uav_detach
          -p attach_topic:=/ugv4/uav_attach -p planner.mode:=$PLANNER
        - until ros2 service list 2>/dev/null | grep -q "/ugv5/rbl_controller/goto" &&
          ros2 service list 2>/dev/null | grep -q "/uav5/warehouse_inspection/inspect"; do sleep 1; done;
          ros2 run rbl_mission ugv_uav_mission_node --ros-args -r __node:=ugv_uav_mission_5
          --params-file ./config/warehouse_map.yaml -p use_sim_time:=true
          -p map.world_sdf:=$(readlink -f ./worlds/$PX4_GZ_WORLD.sdf)
          -p ugv:=ugv5 -p uav:=uav5 -p detach_topic:=/ugv5/uav_detach
          -p attach_topic:=/ugv5/uav_attach -p planner.mode:=$PLANNER
        - "echo \"Wait for 'Arming' in the px4_bridge window (all 5 UGVs) and ~30 s more, then arrow-up: all 5 pairs at once, or one ./deploy.sh pair <k> ... line each   (./deploy.sh map, ./deploy.sh -h, ./deploy.sh abort)\"; if [ -n \"$ZSH_VERSION\" ]; then print -s './deploy.sh abort'; print -s './deploy.sh pair 5 row 5 column 2 left'; print -s './deploy.sh pair 4 row 1 column 2 left'; print -s './deploy.sh pair 3 row 6 column 3 right'; print -s './deploy.sh pair 2 row 3 column 2 right'; print -s './deploy.sh pair 1 row 4 column 3 left'; print -s './deploy.sh pair 1 row 4 column 3 left ; ./deploy.sh pair 2 row 3 column 2 right ; ./deploy.sh pair 3 row 6 column 3 right ; ./deploy.sh pair 4 row 1 column 2 left ; ./deploy.sh pair 5 row 5 column 2 left'; else history -s './deploy.sh abort'; history -s './deploy.sh pair 5 row 5 column 2 left'; history -s './deploy.sh pair 4 row 1 column 2 left'; history -s './deploy.sh pair 3 row 6 column 3 right'; history -s './deploy.sh pair 2 row 3 column 2 right'; history -s './deploy.sh pair 1 row 4 column 3 left'; history -s './deploy.sh pair 1 row 4 column 3 left ; ./deploy.sh pair 2 row 3 column 2 right ; ./deploy.sh pair 3 row 6 column 3 right ; ./deploy.sh pair 4 row 1 column 2 left ; ./deploy.sh pair 5 row 5 column 2 left'; fi"
  - states:
      layout: tiled
      panes:
        - "(ros2 topic echo /ugv_uav_mission_1/state std_msgs/msg/String --qos-durability transient_local --field data & ros2 topic echo /uav1/warehouse_inspection/state std_msgs/msg/String --qos-durability transient_local --field data | sed -u \"s/^/  uav1: /\"; wait)"
        - "(ros2 topic echo /ugv_uav_mission_2/state std_msgs/msg/String --qos-durability transient_local --field data & ros2 topic echo /uav2/warehouse_inspection/state std_msgs/msg/String --qos-durability transient_local --field data | sed -u \"s/^/  uav2: /\"; wait)"
        - "(ros2 topic echo /ugv_uav_mission_3/state std_msgs/msg/String --qos-durability transient_local --field data & ros2 topic echo /uav3/warehouse_inspection/state std_msgs/msg/String --qos-durability transient_local --field data | sed -u \"s/^/  uav3: /\"; wait)"
        - "(ros2 topic echo /ugv_uav_mission_4/state std_msgs/msg/String --qos-durability transient_local --field data & ros2 topic echo /uav4/warehouse_inspection/state std_msgs/msg/String --qos-durability transient_local --field data | sed -u \"s/^/  uav4: /\"; wait)"
        - "(ros2 topic echo /ugv_uav_mission_5/state std_msgs/msg/String --qos-durability transient_local --field data & ros2 topic echo /uav5/warehouse_inspection/state std_msgs/msg/String --qos-durability transient_local --field data | sed -u \"s/^/  uav5: /\"; wait)"
  - micro_xrce_agent:
      layout: tiled
      panes:
        # one agent serves every PX4 instance (each in its own namespace)
        - MicroXRCEAgent udp4 -p 8888
  - gz:
      layout: tiled
      panes:
        - . $PX4_DIR/build/px4_sitl_default/rootfs/gz_env.sh && export GZ_SIM_SERVER_CONFIG_PATH=$(readlink -f ./config/gz_server.config) &&
          W=$PX4_DIR/Tools/simulation/gz/worlds/$PX4_GZ_WORLD.sdf &&
          if [ "$PIN_CPUS" = 1 ]; then taskset -c $GZ_CPUS gz sim --verbose=1 -r -s $W; else gz sim --verbose=1 -r -s $W; fi
        - if [ -z "$HEADLESS" ]; then until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/clock"; do sleep 1; done;
          . $PX4_DIR/build/px4_sitl_default/rootfs/gz_env.sh && gz sim -g; else echo "headless (HEADLESS=0 ./start.sh for the gz GUI)"; fi
  - px4_sitl:
      layout: tiled
      panes:
        # pane order = PX4 instance (ugv<k> = 2(k-1), uav<k> = 2(k-1)+1; set_px4_params.sh relies on it)
        - cp ../px4_sim_ugv_uav_warehouse_stereo/airframes/* $PX4_DIR/build/px4_sitl_default/etc/init.d-posix/airframes/ &&
          until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/clock"; do sleep 1; done;
          cd $PX4_DIR/build/px4_sitl_default/rootfs &&
          PX4_GZ_STANDALONE=1 PX4_SYS_AUTOSTART=4044 PX4_SIM_MODEL=gz_ugv1_carrier_light
          PX4_GZ_MODEL_POSE="$UGV1_X,$UGV1_Y,$UGV_SPAWN_Z,0,0,0" PX4_UXRCE_DDS_NS=ugv_1
          ../bin/px4 -i 0
        - cd $PX4_DIR && until [ -f ./build/px4_sitl_default/etc/init.d-posix/airframes/4043_gz_x500_stereo_cam_down_carried ]; do sleep 1; done;
          until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/model/ugv1_carrier_light_0/"; do sleep 1; done;
          PX4_GZ_STANDALONE=1 GZ_IP=127.0.0.1 PX4_SYS_AUTOSTART=4043 PX4_SIM_MODEL=gz_uav1_x500_light
          PX4_GZ_MODEL_POSE="$UGV1_X,$UGV1_Y,$UAV_SPAWN_Z,0,0,0" PX4_UXRCE_DDS_NS=uav_1
          ./build/px4_sitl_default/bin/px4 -i 1
        - cd $PX4_DIR && until [ -f ./build/px4_sitl_default/etc/init.d-posix/airframes/4044_gz_r1_rover_carrier_stereo ]; do sleep 1; done;
          until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/model/ugv1_carrier_light_0/"; do sleep 1; done;
          PX4_GZ_STANDALONE=1 GZ_IP=127.0.0.1 PX4_SYS_AUTOSTART=4044 PX4_SIM_MODEL=gz_ugv2_carrier_light
          PX4_GZ_MODEL_POSE="$UGV2_X,$UGV2_Y,$UGV_SPAWN_Z,0,0,0" PX4_UXRCE_DDS_NS=ugv_2
          ./build/px4_sitl_default/bin/px4 -i 2
        - cd $PX4_DIR && until [ -f ./build/px4_sitl_default/etc/init.d-posix/airframes/4043_gz_x500_stereo_cam_down_carried ]; do sleep 1; done;
          until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/model/ugv2_carrier_light_2/"; do sleep 1; done;
          PX4_GZ_STANDALONE=1 GZ_IP=127.0.0.1 PX4_SYS_AUTOSTART=4043 PX4_SIM_MODEL=gz_uav2_x500_light
          PX4_GZ_MODEL_POSE="$UGV2_X,$UGV2_Y,$UAV_SPAWN_Z,0,0,0" PX4_UXRCE_DDS_NS=uav_2
          ./build/px4_sitl_default/bin/px4 -i 3
        - cd $PX4_DIR && until [ -f ./build/px4_sitl_default/etc/init.d-posix/airframes/4044_gz_r1_rover_carrier_stereo ]; do sleep 1; done;
          until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/model/ugv1_carrier_light_0/"; do sleep 1; done;
          PX4_GZ_STANDALONE=1 GZ_IP=127.0.0.1 PX4_SYS_AUTOSTART=4044 PX4_SIM_MODEL=gz_ugv3_carrier_light
          PX4_GZ_MODEL_POSE="$UGV3_X,$UGV3_Y,$UGV_SPAWN_Z,0,0,0" PX4_UXRCE_DDS_NS=ugv_3
          ./build/px4_sitl_default/bin/px4 -i 4
        - cd $PX4_DIR && until [ -f ./build/px4_sitl_default/etc/init.d-posix/airframes/4043_gz_x500_stereo_cam_down_carried ]; do sleep 1; done;
          until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/model/ugv3_carrier_light_4/"; do sleep 1; done;
          PX4_GZ_STANDALONE=1 GZ_IP=127.0.0.1 PX4_SYS_AUTOSTART=4043 PX4_SIM_MODEL=gz_uav3_x500_light
          PX4_GZ_MODEL_POSE="$UGV3_X,$UGV3_Y,$UAV_SPAWN_Z,0,0,0" PX4_UXRCE_DDS_NS=uav_3
          ./build/px4_sitl_default/bin/px4 -i 5
        - cd $PX4_DIR && until [ -f ./build/px4_sitl_default/etc/init.d-posix/airframes/4044_gz_r1_rover_carrier_stereo ]; do sleep 1; done;
          until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/model/ugv1_carrier_light_0/"; do sleep 1; done;
          PX4_GZ_STANDALONE=1 GZ_IP=127.0.0.1 PX4_SYS_AUTOSTART=4044 PX4_SIM_MODEL=gz_ugv4_carrier_light
          PX4_GZ_MODEL_POSE="$UGV4_X,$UGV4_Y,$UGV_SPAWN_Z,0,0,0" PX4_UXRCE_DDS_NS=ugv_4
          ./build/px4_sitl_default/bin/px4 -i 6
        - cd $PX4_DIR && until [ -f ./build/px4_sitl_default/etc/init.d-posix/airframes/4043_gz_x500_stereo_cam_down_carried ]; do sleep 1; done;
          until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/model/ugv4_carrier_light_6/"; do sleep 1; done;
          PX4_GZ_STANDALONE=1 GZ_IP=127.0.0.1 PX4_SYS_AUTOSTART=4043 PX4_SIM_MODEL=gz_uav4_x500_light
          PX4_GZ_MODEL_POSE="$UGV4_X,$UGV4_Y,$UAV_SPAWN_Z,0,0,0" PX4_UXRCE_DDS_NS=uav_4
          ./build/px4_sitl_default/bin/px4 -i 7
        - cd $PX4_DIR && until [ -f ./build/px4_sitl_default/etc/init.d-posix/airframes/4044_gz_r1_rover_carrier_stereo ]; do sleep 1; done;
          until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/model/ugv1_carrier_light_0/"; do sleep 1; done;
          PX4_GZ_STANDALONE=1 GZ_IP=127.0.0.1 PX4_SYS_AUTOSTART=4044 PX4_SIM_MODEL=gz_ugv5_carrier_light
          PX4_GZ_MODEL_POSE="$UGV5_X,$UGV5_Y,$UGV_SPAWN_Z,0,0,0" PX4_UXRCE_DDS_NS=ugv_5
          ./build/px4_sitl_default/bin/px4 -i 8
        - cd $PX4_DIR && until [ -f ./build/px4_sitl_default/etc/init.d-posix/airframes/4043_gz_x500_stereo_cam_down_carried ]; do sleep 1; done;
          until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/model/ugv5_carrier_light_8/"; do sleep 1; done;
          PX4_GZ_STANDALONE=1 GZ_IP=127.0.0.1 PX4_SYS_AUTOSTART=4043 PX4_SIM_MODEL=gz_uav5_x500_light
          PX4_GZ_MODEL_POSE="$UGV5_X,$UGV5_Y,$UAV_SPAWN_Z,0,0,0" PX4_UXRCE_DDS_NS=uav_5
          ./build/px4_sitl_default/bin/px4 -i 9
  - px4_params:
      layout: tiled
      panes:
        - ./set_px4_params.sh px4_sitl.0 config/ugv_px4.yaml
        - ./set_px4_params.sh px4_sitl.1 config/uav_px4.yaml
        - ./set_px4_params.sh px4_sitl.2 config/ugv_px4.yaml
        - ./set_px4_params.sh px4_sitl.3 config/uav_px4.yaml
        - ./set_px4_params.sh px4_sitl.4 config/ugv_px4.yaml
        - ./set_px4_params.sh px4_sitl.5 config/uav_px4.yaml
        - ./set_px4_params.sh px4_sitl.6 config/ugv_px4.yaml
        - ./set_px4_params.sh px4_sitl.7 config/uav_px4.yaml
        - ./set_px4_params.sh px4_sitl.8 config/ugv_px4.yaml
        - ./set_px4_params.sh px4_sitl.9 config/uav_px4.yaml
  - gz_bridges:
      layout: tiled
      panes:
        - until gz topic -l 2>/dev/null | grep -q "/world/$PX4_GZ_WORLD/clock"; do sleep 1; done;
          ros2 run ros_gz_bridge parameter_bridge
          "/world/$PX4_GZ_WORLD/clock@rosgraph_msgs/msg/Clock[gz.msgs.Clock"
          --ros-args -r "/world/$PX4_GZ_WORLD/clock:=/clock"
        # depth clouds -> /<vehicle>/sensors/stereo/points (frame <vehicle>/stereo_link, x forward), one
        # bridge per vehicle; no depth image (nothing uses it here)
        - for V in ugv1:ugv1_carrier_light_0 uav1:uav1_x500_light_1 ugv2:ugv2_carrier_light_2 uav2:uav2_x500_light_3 ugv3:ugv3_carrier_light_4 uav3:uav3_x500_light_5 ugv4:ugv4_carrier_light_6 uav4:uav4_x500_light_7 ugv5:ugv5_carrier_light_8 uav5:uav5_x500_light_9; do
          N=${V%%:*}; M=${V#*:};
          S="/world/$PX4_GZ_WORLD/model/$M/link/stereo_link/sensor/stereo_depth/depth_image";
          ( until gz topic -l 2>/dev/null | grep -q "$S/points"; do sleep 1; done;
          ros2 run ros_gz_bridge parameter_bridge "$S/points@sensor_msgs/msg/PointCloud2[gz.msgs.PointCloudPacked"
          --ros-args -r "$S/points:=/$N/sensors/stereo/points"
          -p use_sim_time:=true -r __node:=${N}_stereo_bridge ) & done; wait
        # UAV down cameras -> /<uav>/sensors/down_cam/{image,camera_info}, LAZY: subscribed in gz only
        # while a ROS node subscribes (aruco_landing_target.py, only while its pair lands) -> gz-sensors
        # skips rendering the camera the rest of the time
        - for V in uav1:uav1_x500_light_1 uav2:uav2_x500_light_3 uav3:uav3_x500_light_5 uav4:uav4_x500_light_7 uav5:uav5_x500_light_9; do
          N=${V%%:*}; M=${V#*:};
          S="/world/$PX4_GZ_WORLD/model/$M/link/down_cam_link/sensor/down_cam";
          ( until gz topic -l 2>/dev/null | grep -q "$S/image"; do sleep 1; done;
          ros2 run ros_gz_bridge parameter_bridge "$S/image@sensor_msgs/msg/Image[gz.msgs.Image"
          "$S/camera_info@sensor_msgs/msg/CameraInfo[gz.msgs.CameraInfo"
          --ros-args -r "$S/image:=/$N/sensors/down_cam/image" -p lazy:=true
          -r "$S/camera_info:=/$N/sensors/down_cam/camera_info" -p use_sim_time:=true -r __node:=${N}_down_cam_bridge ) & done; wait
        # ROS -> gz: release / re-attach each UAV on its UGV's deck
        - ros2 run ros_gz_bridge parameter_bridge
          "/ugv1/uav_detach@std_msgs/msg/Empty]gz.msgs.Empty" "/ugv1/uav_attach@std_msgs/msg/Empty]gz.msgs.Empty" "/ugv2/uav_detach@std_msgs/msg/Empty]gz.msgs.Empty" "/ugv2/uav_attach@std_msgs/msg/Empty]gz.msgs.Empty" "/ugv3/uav_detach@std_msgs/msg/Empty]gz.msgs.Empty" "/ugv3/uav_attach@std_msgs/msg/Empty]gz.msgs.Empty" "/ugv4/uav_detach@std_msgs/msg/Empty]gz.msgs.Empty" "/ugv4/uav_attach@std_msgs/msg/Empty]gz.msgs.Empty" "/ugv5/uav_detach@std_msgs/msg/Empty]gz.msgs.Empty" "/ugv5/uav_attach@std_msgs/msg/Empty]gz.msgs.Empty"
          --ros-args -r __node:=uav_dock_bridge
  - sensor_tf:
      layout: tiled
      panes:
        # static "<vehicle>/fcu" -> sensor frames of every vehicle (config/<ugv|uav>_sensors.yaml)
        - for V in ugv1:ugv uav1:uav ugv2:ugv uav2:uav ugv3:ugv uav3:uav ugv4:ugv uav4:uav ugv5:ugv uav5:uav; do ./publish_sensor_tf.sh ${V%%:*} config/${V#*:}_sensors.yaml & done; wait
  - px4_bridge:
      layout: tiled
      panes:
        # UGVs arm right away and hold their spawn point; UAVs stay disarmed on the deck until their mission calls ~/arm
        - ros2 run rbl_px4_bridge px4_bridge_node --ros-args -r __ns:=/ugv1
          -p uav_name:=ugv1 -p control_frame:=$CONTROL_FRAME
          -p home_offset_x:=$UGV1_X -p home_offset_y:=$UGV1_Y -p home_offset_z:=$UGV_HOME_Z
          -p takeoff_altitude:=0.0 -p auto_arm:=true -p max_setpoint_speed:=1.0 -p ground_vehicle:=true
          -p use_sim_time:=true -p publish_rate:=20.0 -p target_system:=1 -p px4_ns:=ugv_1
        - ros2 run rbl_px4_bridge px4_bridge_node --ros-args -r __ns:=/uav1
          -p uav_name:=uav1 -p control_frame:=$CONTROL_FRAME
          -p home_offset_x:=$UGV1_X -p home_offset_y:=$UGV1_Y -p home_offset_z:=$UAV_HOME_Z
          -p takeoff_altitude:=1.5 -p auto_arm:=false -p takeoff_at_current_position:=true
          -p use_sim_time:=true -p publish_rate:=50.0 -p target_system:=2 -p px4_ns:=uav_1
        - ros2 run rbl_px4_bridge px4_bridge_node --ros-args -r __ns:=/ugv2
          -p uav_name:=ugv2 -p control_frame:=$CONTROL_FRAME
          -p home_offset_x:=$UGV2_X -p home_offset_y:=$UGV2_Y -p home_offset_z:=$UGV_HOME_Z
          -p takeoff_altitude:=0.0 -p auto_arm:=true -p max_setpoint_speed:=1.0 -p ground_vehicle:=true
          -p use_sim_time:=true -p publish_rate:=20.0 -p target_system:=3 -p px4_ns:=ugv_2
        - ros2 run rbl_px4_bridge px4_bridge_node --ros-args -r __ns:=/uav2
          -p uav_name:=uav2 -p control_frame:=$CONTROL_FRAME
          -p home_offset_x:=$UGV2_X -p home_offset_y:=$UGV2_Y -p home_offset_z:=$UAV_HOME_Z
          -p takeoff_altitude:=1.5 -p auto_arm:=false -p takeoff_at_current_position:=true
          -p use_sim_time:=true -p publish_rate:=50.0 -p target_system:=4 -p px4_ns:=uav_2
        - ros2 run rbl_px4_bridge px4_bridge_node --ros-args -r __ns:=/ugv3
          -p uav_name:=ugv3 -p control_frame:=$CONTROL_FRAME
          -p home_offset_x:=$UGV3_X -p home_offset_y:=$UGV3_Y -p home_offset_z:=$UGV_HOME_Z
          -p takeoff_altitude:=0.0 -p auto_arm:=true -p max_setpoint_speed:=1.0 -p ground_vehicle:=true
