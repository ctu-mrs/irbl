/**:
  ros__parameters:

    group_odoms:
      enable: false
      add_to_pcl: false
      size: 0

    odometry_topic: odometry

    rate:
      timer_set_ref: 20.0
      timer_diagnostics: 10.0

    rbl_controller:
      limited_fov: true
      only_2d: false
      ciri: true
      reflective_intensity_threshold: -1.0 # [-] <0: every cloud point is an obstacle (no reflective-UAV split)
      lidar_tilt: 90.0 # [deg]
      lidar_fov: 180.0 #[deg]
      step_size: 0.08
      boundary_threshold: 0.3
      z_min: 0.5
      z_max: 5.0
      z_ref: 1.0
      d1: 1.0
      d2: 1.0
      d3: 1.0
      d4: 1.0
      d5: 1.0
      d6: 1.0
      d7: 1.0
      radius: 5.0 # max planning horizon
      betaD: 0.5
      beta_min: 0.05
      dt: 0.1
      encumbrance: 0.4
      use_z_rule: false
      cwvd_obs: 0.99
      cwvd_rob: 0.5
      use_map: true
      use_garmin_alt: false
      replanner: true
      boundary_threshold_speed: 0.01
      move_centroid_to_sensed_cell: false
      octomap:
        octomap_msg: false
      pcl:
        downsample: true
        voxel_size: 0.1
      add_estimates_as_voxels: true

    replanner:
      inflation_bonus: 0.0
      replanner_freq: 5.0 # [Hz] ceiling on how often a fresh full replan is even considered
      replan_progress_threshold: 0.5 # force a fresh replan once this fraction of the current path is covered
      direction_consistency_weight: 600.0 # penalty weight for a fresh plan's start heading diverging from the previous plan's; higher = heading changes discouraged more heavily
      direction_decay_meters: 80.0 # [m] distance over which the above penalty fades out (e^-1 at this distance) -- kept well beyond this scenario's local grid half-width (map_width=30 in rbl_controller_core's ReplannerParams construction) so it stays meaningfully active (>=50% strength) across the whole visible horizon, not just the first ~10-15m of a full replan. Extending path_deviation_distance/weight this far too (instead of just this term) was tried and made things measurably worse -- see path_deviation_weight's comment.
      path_deviation_distance: 4.0 # [m] near-agent distance over which each edge's heading is additionally biased towards the previous path's own local heading
      path_deviation_weight: 25.0 # penalty weight for the near-agent heading bias above. Tried extending this term's distance/weight out to the full horizon (40m/40) instead of relying on direction_consistency_weight/direction_decay_meters for the far field -- measurably worse (more, not fewer, big heading jumps, including new ones near the agent): both penalties are added only into A*'s per-node f-score, not accumulated into g, so making the *local-curve-matching* term dominant over a large area turns frontier-expansion order chaotic (tiny cloud/timing differences between replans flip which locked-in route wins) rather than consistent. direction_consistency_weight's single fixed-bearing reference is far more stable to push hard over a long distance; keep this term scoped to the near field only.
      forward_lock_half_angle_deg: 100.0 # [deg] hard-excludes the fresh plan's very first step from outside this cone around the UAV's real current heading (see replanner.h)

    # Bounded local map of static obstacles (see nodelet/src/local_static_map.h) merged into the
    # live point cloud before it reaches rbl_controller_ at all -- feeds both the reactive CIRI
    # partition and the replanner's grid from one place. Persists obstacle hits across cycles
    # (unlike the raw per-scan cloud) and carves them back out via free-space ray-casting once a
    # later scan sees through where they used to be, so it doesn't accumulate stale/moved obstacles
    # forever.
    static_map:
      voxel_size: 0.1 # [m]
      max_range: 15.0  # [m] occupied cells farther than this from the agent fade out every update
