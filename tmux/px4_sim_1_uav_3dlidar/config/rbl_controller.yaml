/**:
  ros__parameters:

    group_odoms:
      enable: false
      add_to_pcl: false
      size: 0

    odometry_topic: odometry

    rate:
      timer_set_ref: 20.0
      timer_diagnostics: 10.0

    rbl_controller:
      limited_fov: true
      only_2d: false
      ciri: true
      lidar_tilt: 90.0 # [deg]
      lidar_fov: 180.0 #[deg]
      step_size: 0.08
      boundary_threshold: 0.3
      z_min: 0.5
      z_max: 10.0
      z_ref: 1.0
      d1: 1.0
      d2: 1.0
      d3: 1.0
      d4: 1.0
      d5: 1.0
      d6: 1.0
      d7: 1.0
      radius: 5.0 # max planning horizon
      betaD: 0.1
      beta_min: 0.05
      dt: 0.1
      encumbrance: 0.4
      use_z_rule: false
      cwvd_obs: 0.99
      cwvd_rob: 0.5
      use_map: true
      use_garmin_alt: false
      replanner: true
      boundary_threshold_speed: 0.01
      move_centroid_to_sensed_cell: false
      octomap:
        octomap_msg: false
      pcl:
        downsample: true
        voxel_size: 0.1
      add_estimates_as_voxels: true

    replanner:
      inflation_bonus: 0.3
