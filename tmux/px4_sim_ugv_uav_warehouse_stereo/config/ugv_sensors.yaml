# Sensor extrinsics of the UGV (models/r1_rover_carrier_stereo/model.sdf), relative to "ugv1/fcu",
# which px4_bridge places at the UGV's x/y/yaw and at the fixed height env.sh UGV_HOME_Z (0.6 m), not
# at the rover's base_link height. Published by publish_sensor_tf.sh as static TF.
#
# translation: [x, y, z] in meters (FLU), rotation: [roll, pitch, yaw] in radians.
sensors:
  # forward stereo depth camera (same sensor as the UAV's): model.sdf mounts it 0.21 m ahead / 0.25 m
  # above base_link (0.047 m above the floor), untilted -> 0.297 m above the floor = 0.297 - 0.6
  # below the pinned fcu frame, so the cloud keeps its real heights above the floor. Gazebo's depth
  # cloud is x forward / y left / z up (not optical), so no optical rotation. Keep in sync with
  # model.sdf and env.sh.
  - frame_id: ugv_stereo_link
    translation: [0.21, 0.0, -0.303]
    rotation: [0.0, 0.0, 0.0]
