---
# PX4-Autopilot SITL simulation of the irbl stack, two UAVs sharing one gz world, no MRS
# system/library involved. Both vehicles plan/avoid each other in the same control_frame
# ("uav1/world_origin"); rbl_px4_bridge's home_offset_{x,y,z} params correct each vehicle's own
# EKF-local odometry back into that shared frame using its PX4_GZ_MODEL_POSE spawn offset.
root: ./
name: px4_simulation_2uav
socket_name: px4sim2
attach: false
startup_window: activation
pre_window:
  - export PX4_DIR=${PX4_DIR:-$HOME/git/PX4-Autopilot}
  - export HEADLESS=${HEADLESS:-0}
  - export MAP_LENGTH=28.0; export MAP_WIDTH=25.0; export MAP_HEIGHT=10.0; export
    MAP_OBS_NUM=20; export MAP_CIRCLE_NUM=0
  - export UAV2_SPAWN_X=4.0; export UAV2_SPAWN_Y=0.0; export UAV2_SPAWN_Z=0.0
  - export LAZYPX4_BIN=${LAZYPX4_BIN:-$HOME/git/lazypx4/dist/lazypx4}
  - export UAV1_LAZYPX4_PORT=14560; export UAV2_LAZYPX4_PORT=14561
  - source /opt/ros/jazzy/setup.zsh
  - source ../../../../install/setup.zsh
  - export ATUIN_FILTER_MODE=session
windows:
  - micro_xrce_agent:
      layout: tiled
      panes:
        # A single agent on the default port serves every PX4 instance -- each SITL instance
        # picks its own DDS client namespace (px4_1, px4_2, ...) automatically.
        - MicroXRCEAgent udp4 -p 8888
  - px4_sitl:
      layout: tiled
      panes:
        # Pane 0 (instance 0): builds (if needed), starts the gz world and spawns model "x500_0"
        # at the origin.
        # gz_x500_lidar_down: plain x500 airframe plus a downward-facing LW20 rangefinder,
        # published to PX4 as a distance_sensor (see custom_config.yaml's EKF2_RNG_CTRL).
        - cd $PX4_DIR && HEADLESS=$HEADLESS make px4_sitl gz_x500_lidar_down
        # Pane 1 (instance 1): waits for instance 0's build AND for its gz world to actually be up and
        # publishing, then joins it standalone (PX4_GZ_STANDALONE=1). Without PX4_GZ_STANDALONE,
        # this instance re-runs px4-rc.gzsim's own "is a world already running" detection instead
        # of just waiting on the world it already knows is there -- gz_env.sh (GZ_SIM_RESOURCE_PATH
        # etc.) never gets sourced on that path, and this instance's gz_bridge ends up unable to
        # reliably receive the simulated IMU it can still see fine from the outside (`gz topic -e`
        # on its imu topic looks normal) -- PX4's own sensors module then times out reading it
        # ("ERROR [sensors] Accel #0 fail: TIMEOUT!", repeating forever, and the vehicle never
        # passes the preflight checks needed to arm. PX4_GZ_STANDALONE=1 makes this instance take
        # the same "just wait for the world, then attach" path the official multi-vehicle gz sim
        # instructions use for every non-hosting instance, which does not have this problem.
        #
        # GZ_IP=127.0.0.1: `make px4_sitl gz_x500_lidar_down` (instance 0, above) runs through a CTest/CMake
        # wrapper that always pins gz-transport discovery to loopback via this same var. Without
        # it here, gz-transport falls back to auto-selecting a network interface -- on a machine
        # with more than one (this one also has wlan0, tailscale0, several docker bridges), that
        # can differ from instance 0's loopback-only path and pick something less reliable. Instance
        # 0 then looks fine while this one intermittently drops IMU samples once armed and moving
        # (i.e. after "Takeoff detected"), corrupting its EKF estimate and sending it wildly off
        # course -- not just a boot-time arming failure like the STANDALONE issue above.
        - cd $PX4_DIR && until [ -x ./build/px4_sitl_default/bin/px4 ]; do sleep 1; done;
          until gz topic -l 2>/dev/null | grep -q '^/world/.*/clock'; do sleep 1; done;
          PX4_GZ_STANDALONE=1 GZ_IP=127.0.0.1 PX4_SIM_MODEL=gz_x500_lidar_down
          PX4_GZ_MODEL_POSE="$UAV2_SPAWN_X,$UAV2_SPAWN_Y,$UAV2_SPAWN_Z,0,0,0"
          ./build/px4_sitl_default/bin/px4 -i 1
  - px4_healthcheck_fix:
      layout: tiled
      panes:
        # Target panes within the merged px4_sitl window directly (window.pane), since capture-pane/
        # send-keys without a pane index would otherwise only ever hit whichever pane is active.
        - ./fix_arming_healthcheck.sh px4_sitl.0
        - ./fix_arming_healthcheck.sh px4_sitl.1
  - px4_custom_params:
      layout: tiled
      panes:
        - ./set_px4_params.sh px4_sitl.0
        - ./set_px4_params.sh px4_sitl.1
  - lazypx4_link:
      layout: tiled
      panes:
        # A dedicated full-telemetry MAVLink link per vehicle, straight to its own lazypx4 pane
        # (below) -- separate from PX4's own default GCS link so the two vehicles' lazypx4 panes
        # don't end up seeing each other's traffic on one shared port. See start_lazypx4_link.sh.
        - ./start_lazypx4_link.sh px4_sitl.0 19560 $UAV1_LAZYPX4_PORT
        - ./start_lazypx4_link.sh px4_sitl.1 19561 $UAV2_LAZYPX4_PORT
  - lazypx4:
      layout: tiled
      panes:
        # lazypx4 only waits up to 10s for PX4's first heartbeat on startup and never retries after
        # that (see connect_vehicle() in lazypx4/mavlink/connection.py) -- if it's launched before
        # start_lazypx4_link.sh has actually issued `mavlink start` on the corresponding PX4 console
        # (which itself waits for "pxh>", easily >10s into a Gazebo SITL boot), it gets stuck showing
        # "no connection" and needs a manual restart once the link is finally up. So wait for that
        # pane's own confirmation echo first.
        - until tmux -L px4sim2 capture-pane -p -t px4_simulation_2uav:lazypx4_link.0 2>/dev/null | grep -q "for lazypx4"; do sleep 1; done;
          $LAZYPX4_BIN --port $UAV1_LAZYPX4_PORT --lidar-topic /uav1/rbl_controller/cloud
        - until tmux -L px4sim2 capture-pane -p -t px4_simulation_2uav:lazypx4_link.1 2>/dev/null | grep -q "for lazypx4"; do sleep 1; done;
          $LAZYPX4_BIN --port $UAV2_LAZYPX4_PORT --lidar-topic /uav2/rbl_controller/cloud
  - px4_bridge:
      layout: tiled
      panes:
        - export UAV_NAME=uav1; ros2 run rbl_px4_bridge px4_bridge_node --ros-args -r __ns:=/$UAV_NAME
          -p uav_name:=$UAV_NAME -p control_frame:=uav1/world_origin
          -p takeoff_altitude:=2.0 -p auto_arm:=true -p publish_rate:=20.0
        - export UAV_NAME=uav2; ros2 run rbl_px4_bridge px4_bridge_node --ros-args -r __ns:=/$UAV_NAME
          -p uav_name:=$UAV_NAME -p control_frame:=uav1/world_origin
          -p takeoff_altitude:=2.0 -p auto_arm:=true -p publish_rate:=20.0 -p px4_ns:=px4_1 -p target_system:=2
          -p home_offset_x:=$UAV2_SPAWN_X -p home_offset_y:=$UAV2_SPAWN_Y -p home_offset_z:=$UAV2_SPAWN_Z
  - group_state_relay:
      layout: tiled
      panes:
        # Feeds each UAV the other's odometry (replaces MRS multirotor_simulator/uav_poses) so
        # rbl_controller_node's group_odoms collision-avoidance has something to avoid.
        - ros2 run rbl_px4_bridge group_state_relay_node --ros-args
          -p uav_names:="[uav1, uav2]" -p control_frame:=uav1/world_origin
  - map_generator:
      layout: tiled
      panes:
        - ros2 run map_generator random_forest --ros-args
          -p map/x_size:=$MAP_LENGTH -p map/y_size:=$MAP_WIDTH -p map/z_size:=$MAP_HEIGHT
          -p map/obs_num:=$MAP_OBS_NUM -p map/circle_num:=$MAP_CIRCLE_NUM
          -r odometry:=/uav1/odometry
  - rbl_controller:
      layout: tiled
      panes:
        - export UAV_NAME=uav1; ros2 launch rbl_controller_node rbl_controller.launch.py
          uav_name:=$UAV_NAME custom_config:=./config/rbl_controller.yaml
          pcl_topic:=/map_generator/global_cloud control_frame:=uav1/world_origin
        - export UAV_NAME=uav2; ros2 launch rbl_controller_node rbl_controller.launch.py
          uav_name:=$UAV_NAME custom_config:=./config/rbl_controller.yaml
          pcl_topic:=/map_generator/global_cloud control_frame:=uav1/world_origin
  - rviz:
      layout: tiled
      panes:
        - rviz2 -d ./px4_sim.rviz
  - activation:
      layout: tiled
      # synchronize: after turns on tmux's synchronize-panes once these two per-pane setup lines
      # have each run (so each pane keeps its own UAV_NAME/GOAL_*) -- after that, anything typed in
      # one pane (e.g. running ./activation.sh) is sent to both panes at the same keystroke, so
      # both UAVs' goto+activation calls fire together instead of one after another.
      synchronize: after
      panes:
        - export UAV_NAME=uav1; export GOAL_X=10.0; export GOAL_Y=0.0; export GOAL_Z=2.5; export GOAL_YAW=0.0;
          echo "Wait for both px4_sitl panes to finish booting and both px4_bridge panes to print
          'Arming', then run ./activation.sh -- typed once, it runs in both panes at once";
          history -s ./activation.sh
        - export UAV_NAME=uav2; export GOAL_X=10.0; export GOAL_Y=4.0; export GOAL_Z=2.5; export GOAL_YAW=0.0;
          history -s ./activation.sh
