---
# PX4-Autopilot SITL simulation of the irbl stack, two UAVs sharing one gz world, no MRS
# system/library involved. Both vehicles plan/avoid each other in the same control_frame
# ("uav1/world_origin"); rbl_px4_bridge's home_offset_{x,y,z} params correct each vehicle's own
# EKF-local odometry back into that shared frame using its PX4_GZ_MODEL_POSE spawn offset.
root: ./
name: px4_simulation_2uav
socket_name: px4sim2
attach: false
startup_window: activation
pre_window:
  - export PX4_DIR=${PX4_DIR:-$HOME/git/PX4-Autopilot}
  - export HEADLESS=${HEADLESS:-0}
  - export MAP_LENGTH=28.0; export MAP_WIDTH=25.0; export MAP_HEIGHT=10.0; export
    MAP_OBS_NUM=20; export MAP_CIRCLE_NUM=0
  - export UAV2_SPAWN_X=4.0; export UAV2_SPAWN_Y=0.0; export UAV2_SPAWN_Z=0.0
  - source /opt/ros/jazzy/setup.zsh
  - source ../../../../install/setup.zsh
windows:
  - micro_xrce_agent:
      layout: tiled
      panes:
        # A single agent on the default port serves every PX4 instance -- each SITL instance
        # picks its own DDS client namespace (px4_1, px4_2, ...) automatically.
        - MicroXRCEAgent udp4 -p 8888
  - px4_sitl_uav1:
      layout: tiled
      panes:
        # Instance 0: builds (if needed), starts the gz world and spawns model "x500_0" at the origin.
        - cd $PX4_DIR && HEADLESS=$HEADLESS make px4_sitl gz_x500
  - px4_sitl_uav2:
      layout: tiled
      panes:
        # Instance 1: waits for instance 0's build AND for its gz world to actually be up and
        # publishing (the exact check px4-rc.gzsim itself uses to decide whether to start a new
        # world) before launching -- otherwise both instances race that check and each ends up
        # starting its own separate gz world, silently doubling resource usage and desyncing
        # instance 1's simulated clock (seen as IMU "timestamp error" spam and it never arming).
        - cd $PX4_DIR && until [ -x ./build/px4_sitl_default/bin/px4 ]; do sleep 1; done;
          until gz topic -l 2>/dev/null | grep -q '^/world/.*/clock'; do sleep 1; done;
          PX4_SIM_MODEL=gz_x500 PX4_GZ_MODEL_POSE="$UAV2_SPAWN_X,$UAV2_SPAWN_Y,$UAV2_SPAWN_Z,0,0,0"
          ./build/px4_sitl_default/bin/px4 -i 1
  - px4_healthcheck_fix:
      layout: tiled
      panes:
        - ./fix_arming_healthcheck.sh px4_sitl_uav1
        - ./fix_arming_healthcheck.sh px4_sitl_uav2
  - px4_bridge:
      layout: tiled
      panes:
        - export UAV_NAME=uav1; ros2 run rbl_px4_bridge px4_bridge_node --ros-args -r __ns:=/$UAV_NAME
          -p uav_name:=$UAV_NAME -p control_frame:=uav1/world_origin
          -p takeoff_altitude:=2.0 -p auto_arm:=true
        - export UAV_NAME=uav2; ros2 run rbl_px4_bridge px4_bridge_node --ros-args -r __ns:=/$UAV_NAME
          -p uav_name:=$UAV_NAME -p control_frame:=uav1/world_origin
          -p takeoff_altitude:=2.0 -p auto_arm:=true -p px4_ns:=px4_1 -p target_system:=2
          -p home_offset_x:=$UAV2_SPAWN_X -p home_offset_y:=$UAV2_SPAWN_Y -p home_offset_z:=$UAV2_SPAWN_Z
  - group_state_relay:
      layout: tiled
      panes:
        # Feeds each UAV the other's odometry (replaces MRS multirotor_simulator/uav_poses) so
        # rbl_controller_node's group_odoms collision-avoidance has something to avoid.
        - ros2 run rbl_px4_bridge group_state_relay_node --ros-args
          -p uav_names:="[uav1, uav2]" -p control_frame:=uav1/world_origin
  - map_generator:
      layout: tiled
      panes:
        - ros2 run map_generator random_forest --ros-args
          -p map/x_size:=$MAP_LENGTH -p map/y_size:=$MAP_WIDTH -p map/z_size:=$MAP_HEIGHT
          -p map/obs_num:=$MAP_OBS_NUM -p map/circle_num:=$MAP_CIRCLE_NUM
          -r odometry:=/uav1/odometry
  - rbl_controller:
      layout: tiled
      panes:
        - export UAV_NAME=uav1; ros2 launch rbl_controller_node rbl_controller.launch.py
          uav_name:=$UAV_NAME custom_config:=./config/rbl_controller.yaml
          pcl_topic:=/map_generator/global_cloud control_frame:=uav1/world_origin
        - export UAV_NAME=uav2; ros2 launch rbl_controller_node rbl_controller.launch.py
          uav_name:=$UAV_NAME custom_config:=./config/rbl_controller.yaml
          pcl_topic:=/map_generator/global_cloud control_frame:=uav1/world_origin
  - rviz:
      layout: tiled
      panes:
        - rviz2 -d ./px4_sim.rviz
  - activation:
      layout: tiled
      panes:
        - echo "Wait for both px4_sitl_uav* panes to finish booting and both px4_bridge panes to
          print 'Arming', then run ./activation.sh"; history -s ./activation.sh
