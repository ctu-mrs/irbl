dynamic:

  realtime_factor: 1.0 # [-]

individual_takeoff_platform:
  enabled: false

collisions:
  enabled: true
  crash: false

  # if crash==false, then the collisions are elastic
  rebounce: 0.0

# randomization of the initial conditions around the desired spawn point
randomization:

  enabled: false

  bounds:
    x: 15.0
    y: 15.0
    z: 15.0

ground:
  enabled: true
  z: 0.0 # [m]
#
#
frames:
  fcu:
    publish_tf: true

uav_names: [
  "uav1",
  "uav2",
  # "uav3",
]

uav1:
  type: "x500"
  spawn:
    x: -20.0
    y: 0.0
    z: 2.0
    heading: 0.0

uav2:
  type: "x500"
  spawn:
    x: -20.0
    y: 1.5
    z: 2.0
    heading: 0.0

