# GPU=nvidia in ./stack.env: render on the NVIDIA GPU (proprietary driver on the host).
# Needs nvidia-container-toolkit on the host, once:
#   sudo apt install nvidia-container-toolkit
#   sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker

x-nvidia: &nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all     # graphics (GLX / EGL), not only compute
    __GLX_VENDOR_LIBRARY_NAME: nvidia
    __NV_PRIME_RENDER_OFFLOAD: "1"      # hybrid Intel + NVIDIA laptops: render on the NVIDIA GPU

services:
  sim: *nvidia
  rosbag: *nvidia
